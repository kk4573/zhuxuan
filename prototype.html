<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>背单词 · 交互原型</title>
<style>
  :root{
    --bg:#111319; --card:#1a1d26; --line:#2b3140; --fg:#e9ecf3; --dim:#8a92a6;
    --ok:#35d19a; --bad:#ff6b6b; --accent:#6ea8fe; --warn:#e0b155;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);text-align:left;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{width:600px;max-width:100%;padding:14px 16px 18px;}

  .top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim);gap:10px;}
  .top b{color:var(--fg);font-weight:600;}
  .switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;white-space:nowrap;}
  .track{width:32px;height:17px;border-radius:9px;background:#2b3140;position:relative;transition:.15s;flex:none;}
  .track.on{background:var(--accent);}
  .knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s;}
  .track.on .knob{left:17px;}

  .bar{height:3px;background:#232836;border-radius:2px;margin:11px 0 16px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
  .pos{display:inline-block;font-size:11px;color:var(--accent);border:1px solid #33507f;
    background:#1b2740;border-radius:5px;padding:1px 7px;margin-bottom:11px;}
  .cn{font-size:27px;line-height:1.35;font-weight:600;letter-spacing:.5px;min-height:37px;}

  .field{position:relative;margin-top:18px;}
  input{width:100%;background:#12151d;border:2px solid var(--line);border-radius:11px;color:var(--fg);
    font-size:25px;letter-spacing:1px;padding:11px 46px 11px 15px;outline:none;transition:.12s;
    font-family:Consolas,"Courier New",monospace;}
  input::placeholder{font-size:14px;letter-spacing:0;color:#5b6376;}
  input:focus{border-color:#41506e;}
  input.ok{border-color:var(--ok);background:#12241d;color:var(--ok);}
  input.bad{border-color:var(--bad);background:#2a171a;color:#ff9a9a;}
  .spk{position:absolute;right:9px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;
    opacity:.55;background:none;border:none;color:var(--fg);padding:4px;line-height:1;}
  .spk:hover{opacity:1;}
  .spk.hide{visibility:hidden;}

  .fb{margin-top:14px;min-height:82px;font-size:13.5px;line-height:1.75;}
  .fb .row{display:flex;gap:9px;align-items:baseline;}
  .fb .lab{color:var(--dim);font-size:12px;width:62px;flex:none;}
  .ok-t{color:var(--ok);font-weight:700;font-size:15px;}
  .bad-t{color:var(--bad);font-weight:700;font-size:15px;}
  .ans{font-family:Consolas,monospace;font-size:21px;letter-spacing:.5px;color:var(--fg);}
  .ans em{color:var(--ok);font-style:normal;font-weight:700;}
  .mine{font-family:Consolas,monospace;font-size:19px;letter-spacing:.5px;color:#ff9a9a;}
  .mine em{color:#ff6b6b;font-style:normal;font-weight:700;text-decoration:underline;}
  .ph{color:var(--dim);font-size:13px;font-family:Consolas,monospace;}
  .hint{color:var(--warn);font-size:13px;margin-top:2px;}

  .foot{margin-top:13px;font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;}
  kbd{background:#242938;border:1px solid #333a4d;border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-family:inherit;font-size:11px;color:#cfd6e6;}

  .sum{font-size:15px;line-height:1.9;}
  .sum h3{margin:0 0 10px;font-size:17px;}
  .big{font-size:34px;font-weight:700;color:var(--ok);}
  .wronglist{color:var(--bad);font-family:Consolas,monospace;font-size:15px;}
  button.again{margin-top:16px;background:#233049;border:1px solid #33507f;color:#cfe0ff;
    border-radius:9px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit;}
  button.again:hover{background:#2b3d5e;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>第 <b id="idx">1</b> / <span id="total">8</span> 个　·　本轮已对 <b id="right">0</b></div>
    <div class="switch" id="autoBtn">
      <span>打对后自动跳</span>
      <div class="track" id="track"><div class="knob"></div></div>
    </div>
  </div>
  <div class="bar"><i id="prog"></i></div>

  <div class="card" id="card">
    <div class="pos" id="pos">adj.</div>
    <div class="cn" id="cn">无处不在的；普遍存在的</div>
    <div class="field">
      <input id="inp" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="打出对应英文，回车提交">
      <button class="spk hide" id="spk" title="朗读">🔊</button>
    </div>
    <div class="fb" id="fb"></div>
  </div>

  <div class="foot" id="foot">
    <span><kbd>Enter</kbd> 提交</span>
    <span><kbd>空格</kbd> 下一个</span>
    <span>判完后 <kbd>Enter</kbd> 也能进下一个</span>
  </div>
</div>

<script>
/* ---------- 示例词库 ---------- */
const POOL = [
  {en:'ubiquitous',  ph:'/juːˈbɪkwɪtəs/', cn:'无处不在的；普遍存在的', pos:'adj.'},
  {en:'tentative',   ph:'/ˈtentətɪv/',    cn:'试探性的；暂定的',       pos:'adj.'},
  {en:'give up',     ph:'/ɡɪv ʌp/',       cn:'放弃；认输',             pos:'phr.'},
  {en:'maintenance', ph:'/ˈmeɪntənəns/',  cn:'维护；保养',             pos:'n.'},
  {en:'acquire',     ph:'/əˈkwaɪə(r)/',   cn:'获得；学到',             pos:'v.'},
  {en:'thorough',    ph:'/ˈθʌrə/',        cn:'彻底的；周密的',         pos:'adj.'},
  {en:'colleague',   ph:'/ˈkɒliːɡ/',      cn:'同事',                   pos:'n.'},
  {en:'colour',      ph:'/ˈkʌlə(r)/',     cn:'颜色（英式拼法，打 color 也算对）', pos:'n.'}
];

/* ---------- 判定规则 ---------- */
const ALIAS = {
  colour:'color', favourite:'favorite', honour:'honor', behaviour:'behavior',
  labour:'labor', neighbour:'neighbor', centre:'center', theatre:'theater',
  metre:'meter', litre:'liter', travelled:'traveled', cancelled:'canceled',
  grey:'gray', licence:'license', practise:'practice', analyse:'analyze'
};
function canon(w){
  w = String(w).trim().replace(/\s+/g,' ').toLowerCase().replace(/[’‘]/g,"'")
       .replace(/^[^a-z]+|[^a-z]+$/g,'');
  if (ALIAS[w]) return ALIAS[w];
  return w.replace(/isation$/,'ization').replace(/ise$/,'ize')
          .replace(/our$/,'or').replace(/re$/,'er').replace(/lled$/,'led');
}
const isRight = (mine, ans) => canon(mine) === canon(ans);

function lev(a,b){
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r;});
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function markDiff(mine, ans){
  if (mine.length === ans.length && mine.length > 0){
    let mh='', ah='';
    for (let k=0;k<mine.length;k++){
      const same = mine[k].toLowerCase() === ans[k].toLowerCase();
      mh += same ? esc(mine[k]) : '<em>'+esc(mine[k])+'</em>';
      ah += same ? esc(ans[k])  : '<em>'+esc(ans[k])+'</em>';
    }
    return [mh, ah];
  }
  return [esc(mine), esc(ans)];
}

/* ---------- 状态 ---------- */
let queue=[], i=0, submitted=false, rightCount=0, auto=false, autoTimer=null;

function shuffle(a){ for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];} return a; }

const $ = id => document.getElementById(id);

function start(){
  queue = shuffle(POOL.map(w => Object.assign({}, w, {mastery:0, wrong:false})));
  i=0; rightCount=0; autoTimer=null;
  $('total').textContent = queue.length;
  $('right').textContent = '0';
  $('card').style.display='';
  $('foot').style.display='';
  render();
}

function render(){
  const w = queue[i], inp = $('inp');
  submitted = false;
  $('idx').textContent = i+1;
  $('pos').textContent = w.pos;
  $('cn').textContent = w.cn;
  inp.value=''; inp.className=''; inp.readOnly=false;
  $('spk').classList.add('hide');
  $('fb').innerHTML='';
  $('prog').style.width = (i/queue.length*100)+'%';
  setTimeout(()=>inp.focus(), 0);
}

function submit(){
  const w = queue[i], inp = $('inp');
  const my = inp.value.trim();
  if (!my) return;
  submitted = true;
  inp.readOnly = true; inp.blur();
  $('spk').classList.remove('hide');
  const fb = $('fb');

  if (isRight(my, w.en)){
    w.mastery++;
    rightCount++;
    $('right').textContent = rightCount;
    inp.className = 'ok';
    fb.innerHTML =
      '<div class="row"><span class="ok-t">✓ 正确</span></div>' +
      '<div class="row"><span class="lab">答案</span><span class="ans">'+esc(w.en)+'</span>' +
      '<span class="ph">'+esc(w.ph)+'</span></div>' +
      '<div class="row"><span class="lab">掌握度</span><span class="hint">'+(w.mastery-1)+' → '+w.mastery+'</span></div>';
    speak(w.en);
    if (auto) autoTimer = setTimeout(next, 800);
  } else {
    w.mastery = Math.max(0, w.mastery-2);
    w.wrong = true;
    inp.className = 'bad';
    const d = lev(canon(my), canon(w.en));
    const pair = markDiff(my, w.en);
    let hint;
    if (my.length > w.en.length) hint = '多打了 '+(my.length-w.en.length)+' 个字母';
    else if (d <= 2) hint = '接近了！只差 '+d+' 个字母';
    else hint = '再想想，按空格看下一个';
    fb.innerHTML =
      '<div class="row"><span class="bad-t">✕ 拼错了</span></div>' +
      '<div class="row"><span class="lab">你写的</span><span class="mine">'+pair[0]+'</span></div>' +
      '<div class="row"><span class="lab">正确答案</span><span class="ans">'+pair[1]+'</span>' +
      '<span class="ph">'+esc(w.ph)+'</span></div>' +
      '<div class="hint">'+esc(hint)+'</div>';
  }
  $('prog').style.width = ((i+1)/queue.length*100)+'%';
}

function next(){
  clearTimeout(autoTimer);
  if (i < queue.length-1){ i++; render(); }
  else finish();
}

function finish(){
  const wrong = queue.filter(w => w.wrong);
  const rate = Math.round(rightCount/queue.length*100);
  $('prog').style.width='100%';
  $('foot').style.display='none';
  $('card').innerHTML =
    '<div class="sum">' +
      '<h3>本轮完成</h3>' +
      '<div><span class="big">'+rightCount+' / '+queue.length+'</span>　正确率 '+rate+'%</div>' +
      (wrong.length
        ? '<div style="margin-top:14px">错词（已收进错词本）：<br><span class="wronglist">'+
            wrong.map(w=>esc(w.en)).join('　')+'</span></div>'
        : '<div style="margin-top:14px;color:var(--ok)">全部答对，漂亮。</div>') +
      '<button class="again" id="again">再来一轮</button>' +
    '</div>';
  $('again').onclick = ()=>{ $('card').innerHTML = CARD_HTML; initRefs(); start(); };
}

/* 卡片原始结构（用于「再来一轮」重建） */
const CARD_HTML = $('card').innerHTML;
function initRefs(){
  $('inp').addEventListener('input', ()=>{});
}
function speak(t){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US'; u.rate = .85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 事件 ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    e.preventDefault();
    if (!submitted) submit(); else next();
    return;
  }
  if (e.code === 'Space' && submitted){
    e.preventDefault();
    next();
    return;
  }
  if (submitted && e.key && e.key.length === 1) e.preventDefault();
});
document.addEventListener('click', e => {
  const spk = e.target.closest('#spk');
  if (spk && !spk.classList.contains('hide')) speak(queue[i].en);
  const btn = e.target.closest('#autoBtn');
  if (btn){
    auto = !auto;
    $('track').classList.toggle('on', auto);
    if (auto && submitted) autoTimer = setTimeout(next, 800);
  }
});
start();
</script>
</body>
</html>
